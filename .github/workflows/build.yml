name: build-pdf
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (basic)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra \
                                  texlive-fonts-recommended texlive-bibtex-extra \
                                  biber latexmk
      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -file-line-error main.tex
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Architecture_of_the_Night
          path: main.pdf
